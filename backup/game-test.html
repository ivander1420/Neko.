<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEKO Game Test Harness</title>
<style>
  body{margin:0;background:#0a0f1f;color:#e2e8f0;font:14px system-ui,sans-serif;padding:16px}
  #report{white-space:pre-wrap;font-family:monospace;font-size:12px;line-height:1.7}
  .ok{color:#a3e635}.bad{color:#fb7185}
  #arena{position:fixed;inset:0;z-index:-1;opacity:0;pointer-events:none}
  .game-frame{width:420px}
</style>
</head>
<body>
<h2>NEKO · Uji Game Baru</h2>
<div id="report">Memuat…</div>
<div id="arena"></div>
<script src="../js/util.js"></script>
<script src="../js/icons.js"></script>
<script>
  // Stub modul yang tidak perlu untuk uji logika/render game.
  window.Neko = window.Neko || {};
  Neko.audio = { play(){}, init(){} };
  Neko.ui = { confetti(){}, toast(){}, sheet(){ return { close(){} }; }, openCount:0 };
  Neko.store = { profile:null, setSession(){} };
  window.__errs = [];
  window.addEventListener('error', e => window.__errs.push(String(e.message)+' @'+(e.filename||'').split('/').pop()+':'+(e.lineno||'')));
  window.addEventListener('unhandledrejection', e => window.__errs.push('REJECT: '+String(e.reason&&e.reason.message||e.reason)));
</script>
<script src="../js/games/arcade.js"></script>
<script src="../js/games/puzzle.js"></script>
<script src="../js/arena.js"></script>
<script>
(function(){
  const arena = document.getElementById('arena');
  const report = document.getElementById('report');
  const wait = ms => new Promise(r=>setTimeout(r,ms));

  function makeCtx(id, config){
    const layer = document.createElement('div');
    layer.innerHTML = '<div class="game-stage"><div class="game-frame"></div></div>';
    arena.appendChild(layer);
    const frame = layer.querySelector('.game-frame');
    const cleanups = [];
    let ended = false;
    const ctx = {
      id, config: config||{rounds:8,players:1,level:'normal'},
      difficulty:{label:'Normal',bonus:1,limit:18},
      meta:{id,name:id},
      frame, layer,
      audio:Neko.audio, util:Neko.util, store:Neko.store,
      get ended(){return ended;},
      setStage(html){ frame.innerHTML=html; return frame; },
      setHUD(){}, setSub(){},
      cleanup(fn){ cleanups.push(fn); },
      confetti(){}, toast(){},
      finish(result){ ended=true; ctx.lastResult=result; cleanups.forEach(f=>{try{f()}catch(e){}}); },
      close(){ ended=true; cleanups.forEach(f=>{try{f()}catch(e){}}); layer.remove(); }
    };
    ctx._clean = ()=>{ ended=true; cleanups.forEach(f=>{try{f()}catch(e){}}); layer.remove(); };
    return ctx;
  }

  function firePointer(el, type, x, y){
    const r = el.getBoundingClientRect();
    const ev = new PointerEvent(type, {bubbles:true, cancelable:true, clientX:r.left+(x==null?r.width/2:x), clientY:r.top+(y==null?r.height/2:y), pointerId:1, buttons:type==='pointerup'?0:1});
    el.dispatchEvent(ev);
  }
  function clickEl(el){ if(el) el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); }

  const IDS = ['stack','knife','doodle','slice','breakout','colorswitch','piano','shooter','mines','pipe','sort','match3','lights','gomoku'];

  async function testOne(id){
    const before = window.__errs.length;
    const ctx = makeCtx(id, {rounds: (Neko.games[id]&&id==='breakout')?40:8, players:1, level:'normal'});
    let mountErr = null;
    try { Neko.games[id].mount(ctx); } catch(e){ mountErr = String(e.message); }
    await wait(120);
    const canvas = ctx.frame.querySelector('canvas');
    const cells = ctx.frame.querySelectorAll('.pz-cell');
    const tubes = ctx.frame.querySelectorAll('.pz-tube');
    const rendered = !!canvas || cells.length>0 || tubes.length>0;
    // simulate input
    try {
      if (canvas){
        firePointer(canvas,'pointerdown');
        await wait(60);
        firePointer(canvas,'pointermove', 100, 200);
        firePointer(canvas,'pointerup');
        if (id==='piano'){ firePointer(canvas,'pointerdown', 30, 500); }
        if (id==='shooter'||id==='breakout'||id==='doodle'){ firePointer(canvas,'pointerdown',80,300); firePointer(canvas,'pointermove',300,300); }
      } else if (id==='mines'){ clickEl(cells[40]); await wait(60); clickEl(cells[0]); }
      else if (id==='pipe'){ clickEl(cells[0]); clickEl(cells[1]); }
      else if (id==='lights'){ clickEl(cells[0]); clickEl(cells[1]); }
      else if (id==='sort'){ clickEl(tubes[0]); await wait(40); clickEl(tubes[tubes.length-1]); }
      else if (id==='match3'){ clickEl(cells[0]); await wait(40); clickEl(cells[1]); }
      else if (id==='gomoku'){ clickEl(cells[Math.floor(cells.length/2)]); await wait(600); }
      await wait(220);
    } catch(e){ mountErr = (mountErr?mountErr+'; ':'')+'input:'+e.message; }
    const newErrs = window.__errs.slice(before);
    const result = ctx.lastResult ? 'finish:'+ctx.lastResult.won : 'running';
    ctx._clean();
    await wait(60);
    return { id, rendered, mountErr, errs:newErrs, state:result, cells:cells.length, tubes:tubes.length, canvas:!!canvas };
  }

  window.runGameTests = async function(){
    const out = [];
    for (const id of IDS){ out.push(await testOne(id)); }
    const lines = out.map(r=>{
      const good = r.rendered && !r.mountErr && r.errs.length===0;
      return (good?'[OK]  ':'[FAIL]')+' '+r.id.padEnd(12)+' render='+r.rendered+' '+(r.canvas?'canvas':(r.tubes?('tubes:'+r.tubes):('cells:'+r.cells)))+' '+r.state+(r.mountErr?' MOUNT_ERR='+r.mountErr:'')+(r.errs.length?' ERRS='+r.errs.join(' | '):'');
    });
    const fails = out.filter(r=>!r.rendered||r.mountErr||r.errs.length);
    const summary = '\n=== '+out.length+' game diuji, '+fails.length+' gagal, total error='+window.__errs.length+' ===';
    report.innerHTML = lines.map(l=>'<span class="'+(l.startsWith('[OK]')?'ok':'bad')+'">'+l.replace(/</g,'&lt;')+'</span>').join('\n')+summary;
    window.__results = out;
    return {passed:out.length-fails.length, failed:fails.length, errors:window.__errs.length, details:out};
  };
  report.textContent = 'Siap. Panggil runGameTests().';
  const params = new URLSearchParams(location.search);
  const visualGame = params.get('view');
  if (IDS.includes(visualGame)) {
    document.documentElement.dataset.theme = 'paper';
    document.documentElement.dataset.mode = 'dark';
    ['base', 'layout', 'components', 'themes', 'polish', 'paper', 'scenes', 'ornaments', 'book', 'games', 'arcade', 'views', 'social', 'live', 'rooms', 'nobar', 'messages', 'avatars', 'intro', 'glass'].forEach(name => {
      const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '../css/' + name + '.css'; document.head.appendChild(link);
    });
    document.querySelector('h2').textContent = 'Pratinjau lokal · tanpa akun/server';
    report.hidden = true;
    arena.style.cssText = 'position:relative;z-index:auto;opacity:1;pointer-events:auto;width:100%';
    const style = document.createElement('style');
    style.textContent = 'body{padding:14px}body>h2{font-size:12px;color:var(--muted);margin:0 0 18px}#arena .game-frame{width:100%;padding:0}#arena .game-stage{padding:0}';
    document.head.appendChild(style);
    const game = [...Neko.arcadeGames, ...Neko.puzzleGames].find(g => g.id === visualGame);
    const config = {rounds:game.defaults,players:1,level:'normal'};
    if (params.has('ready')) Neko.arena.start(visualGame, config);
    else Neko.games[visualGame].mount(makeCtx(visualGame, config));
  }
})();
</script>
</body>
</html>
